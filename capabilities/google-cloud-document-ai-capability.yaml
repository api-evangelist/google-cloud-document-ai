      path: /projects/{projectId}/locations/{location}/processors
      operations:
      - name: listprocessors
        method: GET
        description: Google Cloud Document AI List processors
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createprocessor
        method: POST
        description: Google Cloud Document AI Create a processor
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-projectid-locations-location-processors
      path: /projects/{projectId}/locations/{location}/processors/{processorId}:process
      operations:
      - name: processdocument
        method: POST
        description: Google Cloud Document AI Process a document
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: processorId
          in: path
          type: string
          required: true
